<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Grid Bookstore</title>
    <style>
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
        
        header { background: #2c3e50; color: white; padding: 1.5rem; text-align: center; position: sticky; top: 0; z-index: 100; }
        
        .book-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover { transform: translateY(-10px); }
        .book-img { width: 100%; height: 300px; object-fit: cover; background: #ddd; }
        .book-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .book-title { font-size: 1.2rem; margin-bottom: 0.5rem; color: #2c3e50; }
        .book-author { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 1rem; }
        .book-price { font-weight: bold; color: #e67e22; font-size: 1.1rem; margin-top: auto; }
        
        
        .buy-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 0.8rem;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 1rem;
            border-radius: 4px;
        }
        .buy-btn:hover { background: #219150; }

        
        @media (max-width: 600px) {
            .book-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Reading Nook</h1>
        <p>Your Favorite Online Bookstore</p>
    </header>

   
    <main id="book-grid" class="book-container">
     
    </main>

    <script>
     
        const books = [
            { title: "The Great Gatsby", author: "F. Scott Fitzgerald", price: "$15.99", img: "https://placeholder.com" },
            { title: "1984", author: "George Orwell", price: "$12.50", img: "https://placeholder.com" },
            { title: "To Kill a Mockingbird", author: "Harper Lee", price: "$14.20", img: "https://placeholder.com" },
            { title: "Brave New World", author: "Aldous Huxley", price: "$11.95", img: "https://placeholder.com" },
            { title: "The Hobbit", author: "J.R.R. Tolkien", price: "$18.00", img: "https://placeholder.com" },
            { title: "Fahrenheit 451", author: "Ray Bradbury", price: "$13.40", img: "https://placeholder.com" }
        ];

       
        function displayBooks() {
            const grid = document.getElementById('book-grid');
            
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                
                card.innerHTML = `
                    <img src="${book.img}" alt="${book.title}" class="book-img">
                    <div class="book-info">
                        <h2 class="book-title">${book.title}</h2>
                        <p class="book-author">by ${book.author}</p>
                        <p class="book-price">${book.price}</p>
                        <button class="buy-btn" onclick="addToCart('${book.title}')">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Simple action handler
        function addToCart(title) {
            alert(title + " added to your cart!");
        }

        // Initialize display on load
        window.onload = displayBooks;
    </script>
</body>
</html>
