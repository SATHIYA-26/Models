
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Grid Bookstore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
        header { background: #2c3e50; color: white; padding: 1.5rem; text-align: center; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; }
        
        
        .cart-icon { cursor: pointer; position: relative; font-size: 1.2rem; background: #e67e22; padding: 0.5rem 1rem; border-radius: 5px; }
        #cart-count { background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.8rem; position: absolute; top: -5px; right: -5px; }

        .book-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .book-card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .book-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .book-title { font-size: 1.2rem; margin-bottom: 0.5rem; color: #2c3e50; }
        .book-price { font-weight: bold; color: #e67e22; font-size: 1.1rem; margin-top: auto; }
        .buy-btn { background: #27ae60; color: white; border: none; padding: 0.8rem; width: 100%; cursor: pointer; font-weight: bold; margin-top: 1rem; border-radius: 4px; }

       
        #cart-sidebar { position: fixed; right: -400px; top: 0; width: 350px; height: 100%; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.2); transition: 0.3s; z-index: 200; padding: 2rem; display: flex; flex-direction: column; }
        #cart-sidebar.active { right: 0; }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 10px 0; }
        .close-cart { cursor: pointer; color: red; font-weight: bold; margin-bottom: 1rem; text-align: right; }
        .checkout-btn { background: #2c3e50; color: white; padding: 1rem; border: none; width: 100%; cursor: pointer; margin-top: auto; font-weight: bold; }

        
        #payment-page { display: none; padding: 2rem; max-width: 600px; margin: 50px auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
         .admin-link {
            display: inline-block; margin-top: 20px; font-size: 14px;
            color: #666; text-decoration: none;
        }
        .admin-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
    <header>
        <div>
            <h1>The Reading Nook</h1>
            <p>Your Favorite Online Bookstore</p>
        </div>
        <div class="cart-icon" onclick="toggleCart()"> Cart <span id="cart-count">0</span></div>
    </header>

    
    <main id="store-view">
        <div id="book-grid" class="book-container"></div>
    </main>

    
    <div id="cart-sidebar">
        <div class="close-cart" onclick="toggleCart()">X Close</div>
        <h2>Your Cart</h2>
        <div id="cart-items-list" style="margin-top: 1rem;"></div>
        <div style="margin-top: 1rem; font-weight: bold;">Total: <span id="cart-total-price">0</span>/-</div>
        <button class="checkout-btn" onclick="goToPayment()">Proceed to Payment</button>
    </div>
    <br><br>
    <a href="login.html" class="admin-link">Logout</a>

    
    <div id="payment-page">
        <h2>Secure Payment</h2>
        <p>Complete your purchase for: <span id="payment-total" style="font-weight: bold; color: #e67e22;"></span></p>
        <div style="margin-top: 2rem;">
            <input type="text" placeholder="Card Number" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">
            <button class="buy-btn" onclick="processPayment()">Pay Now</button>
            <button onclick="backToStore()" style="background: none; border: none; color: blue; cursor: pointer; margin-top: 10px;">Back to Store</button>
        </div>
    </div>

    <script>
        const books = [
            { title: "Python", author: "Sathiya", price: 100 },
            { title: "Java", author: "Sathiya", price: 200 },
            { title: "DSA", author: "Sathiya", price: 300 },
            { title: "C", author: "Sathiya", price: 400 },
            { title: "Algorithm", author: "Sathiya", price: 500 },
            { title: "LeetCode", author: "Sathiya", price: 600 }
        ];

        let cart = [];

        function displayBooks() {
            const grid = document.getElementById('book-grid');
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-info">
                        <h2 class="book-title">${book.title}</h2>
                        <p class="book-author">by ${book.author}</p>
                        <p class="book-price">${book.price}/-</p>
                        <button class="buy-btn" onclick="addToCart('${book.title}')">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(title) {
            const book = books.find(b => b.title === title);
            cart.push(book);
            updateCartUI();
            alert(title + " added to your cart!");
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            list.innerHTML = "";
            let total = 0;
            
            cart.forEach((item, index) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `<span>${item.title}</span> <span>${item.price}/-</span>`;
                list.appendChild(div);
            });
            document.getElementById('cart-total-price').innerText = total;
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('active');
        }

        function goToPayment() {
            if (cart.length === 0) return alert("Your cart is empty!");
            document.getElementById('store-view').style.display = 'none';
            document.getElementById('payment-page').style.display = 'block';
            document.getElementById('payment-total').innerText = document.getElementById('cart-total-price').innerText + "/-";
            toggleCart();
        }

        function backToStore() {
            document.getElementById('store-view').style.display = 'block';
            document.getElementById('payment-page').style.display = 'none';
        }

        function processPayment() {
            alert("Payment Successful! Thank you for buying.");
            cart = [];
            updateCartUI();
            backToStore();
        }

        window.onload = displayBooks;
    </script>
</body>
</html>
