<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Store - Login</title>
    <style>
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
    
        .login-card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 25px; }
       
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #ccc; border-radius: 6px; font-size: 16px;
        }
        input:focus { border-color: #007bff; outline: none; }
       
        .btn-login {
            display: block; width: 100%; padding: 12px; margin-top: 15px;
            background: #007bff; color: white; text-decoration: none;
            border-radius: 6px; font-weight: bold; transition: 0.3s;
        }
        .btn-login:hover { background: #0056b3; }
        .admin-link {
            display: inline-block; margin-top: 20px; font-size: 14px;
            color: #666; text-decoration: none;
        }
        .admin-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Book Store</h2>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <a href="payment.html" class="btn-login">Login</a>
        <a href="admin.html" class="admin-link">Admin Login</a>
    </div>
</body>
</html>
